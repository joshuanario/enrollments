services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: enrollments
      POSTGRES_PASSWORD: enrollments
      POSTGRES_DB: enrollments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrollments -d enrollments"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://enrollments:enrollments@db:5432/enrollments?sslmode=disable
      # Upsert the "setup" paths from test/fixtures/scenarios.json on start (skips existing ones).
      SEED_SETUP: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
